<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗罗大陆 · 转盘人生模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 18%, rgba(140,170,255,.10), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(255,190,90,.08), transparent 45%),
      #0a0a14;
    color: #e8ecf7;
    display: flex; justify-content: center; align-items: center;
    padding: 24px 16px; position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 50% 40%, rgba(120,150,255,.06), transparent 60%);
  }
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle { position: absolute; width: 2px; height: 2px; background: rgba(180,200,255,.45); border-radius: 50%; animation: float linear infinite; }
  .particle:nth-child(1){left:12%;top:22%;animation-duration:18s;width:3px;height:3px;}
  .particle:nth-child(2){left:80%;top:18%;animation-duration:22s;animation-delay:2s;}
  .particle:nth-child(3){left:30%;top:78%;animation-duration:20s;animation-delay:4s;width:4px;height:4px;}
  .particle:nth-child(4){left:70%;top:72%;animation-duration:25s;animation-delay:1s;}
  @keyframes float {
    0%{transform:translateY(0) translateX(0);opacity:.2;}
    50%{transform:translateY(-120px) translateX(30px);opacity:.6;}
    100%{transform:translateY(-240px) translateX(-20px);opacity:0;}
  }

  .card {
    position: relative; z-index: 1; max-width: 560px; width: 100%;
    background: rgba(10,12,26,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(150,170,255,.22); border-radius: 32px;
    box-shadow: 0 25px 80px rgba(0,0,0,.75), inset 0 1px 0 rgba(200,215,255,.06);
    padding: 40px 32px 30px; text-align: center;
  }
  .ornament { letter-spacing: 8px; opacity: .5; margin-bottom: 8px; font-size: 18px; color:#cfe2ff; }
  h1 {
    font-size: 34px; letter-spacing: 6px; font-weight: 700;
    background: linear-gradient(135deg,#cfe2ff,#7aa0ff,#4a6dd8,#cfe2ff);
    background-size: 200% 200%; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s ease-in-out infinite alternate;
    font-family: 'Times New Roman','PingFang SC',serif;
  }
  @keyframes shimmer { 0%{background-position:0% 50%;} 100%{background-position:100% 50%;} }
  .subtitle { margin-top: 8px; color: rgba(150,180,255,.6); font-size: 13px; letter-spacing: 4px; }
  .desc { margin: 22px 0; color: rgba(220,228,248,.72); font-size: 14px; line-height: 1.7; }

  .enter-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 44px; font-size: 18px; font-weight: 700; letter-spacing: 4px;
    color: #0a1230; background: linear-gradient(135deg,#cfe2ff,#7aa0ff);
    border: none; border-radius: 60px; cursor: pointer; text-decoration: none;
    box-shadow: 0 6px 30px rgba(120,150,255,.35); transition: transform .18s, box-shadow .18s;
  }
  .enter-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 40px rgba(120,150,255,.45); }

  .meta { margin-top: 14px; font-size: 12px; color: rgba(150,180,255,.45); }

  .nav {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
    margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(150,170,255,.14);
  }
  .nav a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px; text-decoration: none;
    border: 1px solid rgba(150,170,255,.28); color: #cfe2ff;
    background: rgba(150,170,255,.06); font-size: 13px;
    transition: background .2s, border-color .2s, transform .12s;
  }
  .nav a:hover { background: rgba(150,170,255,.16); border-color:#cfe2ff; transform: translateY(-2px); }
  .nav .chip { display:inline-block; width:20px; height:20px; line-height:20px; border-radius:6px; background:linear-gradient(135deg,#cfe2ff,#7aa0ff); color:#0a1230; font-size:11px; font-weight:700; }
  footer { margin-top: 26px; font-size: 11px; color: rgba(150,180,255,.4); letter-spacing: 1px; }
  footer a { color: rgba(207,226,255,.7); text-decoration: none; }
</style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <div class="card">
    <div class="ornament">✦ ⚜ ✦</div>
    <h1>斗罗大陆</h1>
    <div class="subtitle">转 盘 人 生 模 拟 器</div>
    <p class="desc">
      一人一武魂 · 问鼎神界。<br>
      穿越斗一 / 斗二时代，觉醒武魂、修炼魂力、猎取魂环魂骨、锻造魂导器，
      书写你的斗罗人生。
    </p>
    <a class="enter-btn" href="./斗罗大陆.html">🌀 开始模拟</a>
    <div class="meta">含 斗一·斗罗大陆 与 斗二·绝世唐门 两大时代</div>

    <div class="nav">
      <a href="https://yamgchenghu.github.io/-Zhuanpanmen-Chuqi/" target="_blank" rel="noopener">
        <span class="chip">初</span>前往 初七的转盘
      </a>
      <a href="https://yamgchenghu.github.io/Zhuanpanmen-RST103/" target="_blank" rel="noopener">
        <span class="chip">我</span>我的 index
      </a>
      <a href="https://github.com/Yamgchenghu/Zhuanpanmen-RST103" target="_blank" rel="noopener">
        <span class="chip">仓</span>我的仓库
      </a>
    </div>

    <footer>
      实时来源：<a href="https://github.com/Yamgchenghu/Zhuanpanmen-RST103" target="_blank" rel="noopener">github.com/Yamgchenghu/Zhuanpanmen-RST103</a>
    </footer>
  </div>
</body>
</html>
