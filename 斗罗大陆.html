        function huntRing() {
            if (!isForest(game.currentLocation)) { addLog('info', '猎魂需在森林区域（星斗大森林/落日森林/冰封森林），请先前往。'); return; }
            if (game.ap < 2) { addLog('info', '行动点不足（需2点）。'); return; }
            const ringIdx = game.rings.length + 1;
            if (ringIdx > 9) { addLog('info', '魂环已满。'); return; }
            const neededLv = ringIdx * 10;
            if (game.level < neededLv) { addLog('info', `你尚未达到${neededLv}级，无法吸收第${ringIdx}个魂环。`); return; }
            game.ap -= 2;
            // 建议年限
            let ageIdx;
            if (ringIdx <= 2) ageIdx = 1;          // 百年
            else if (ringIdx === 3) ageIdx = 2;     // 千年
            else if (ringIdx <= 6) ageIdx = 3;      // 万年
            else ageIdx = 4;                         // 十万年
            const beast = BEASTS.filter(b => b.ageIdx === ageIdx);
            const selected = beast[Math.floor(Math.random() * beast.length)] || BEASTS[0];
            // 魂兽属性（按年限与等级）
            const hp = AGE_HP[ageIdx] + neededLv * 6;
            const attack = Math.floor((neededLv * 4 + 20) * (0.9 + Math.random() * 0.2));
            const defense = Math.floor((neededLv * 3 + 10) * (0.9 + Math.random() * 0.2));
            game.battleEnemy = { name: `${selected.name}`, age: AGE_IDX[ageIdx], ageIdx, level: neededLv, hp, maxHp: hp, attack, defense, isRingHunt: true, ringIdx };
            addLog('important', `🐾 你在星斗大森林猎杀「${selected.name}」（${AGE_IDX[ageIdx]}），目标第${ringIdx}枚魂环！`);
            openBattle();
        }

        function absorbRing(enemy) {
            const ringIdx = enemy.ringIdx || (game.rings.length + 1);
            const ageIdx = enemy.ageIdx || 1;
            const skillPool = game.spirit ? game.spirit.skills : ['魂技'];
            // 十万年魂环提供 2 个魂技
            const nSkills = ageIdx === 4 ? 2 : 1;
            const skills = [];
            for (let i = 0; i < nSkills; i++) skills.push(skillPool[(ringIdx - 1 + i) % skillPool.length] + (nSkills === 2 && i > 0 ? '·究极' : ''));
            const color = RING_COLOR[ageIdx] || '#ffd54f';
            const atkBonus = [0, 0, 4, 6, 10][ageIdx] || 3;
            const defBonus = [0, 0, 2, 3, 6][ageIdx] || 2;
            const ring = { name: `${enemy.name}·${AGE_IDX[ageIdx]}`.slice(0, 12), age: AGE_IDX[ageIdx], ageIdx, skills, color, atk: atkBonus, def: defBonus, ringIdx, power: ageIdx };
            game.rings.push(ring);
            addLog('important', `🌌 吸收魂环成功！获得魂技「${skills.join('、')}」！攻击+${atkBonus}，防御+${defBonus}。`);
            rebuildSkills();
            syncMaxHp();
            if (ageIdx === 4) { /* 十万年魂兽被击杀必得魂骨，在 handleVictory 中处理 */ }
            renderRingSlots();
            renderAllPanels();
        }

        // ===== 魂技 =====
        function renderSkill(content) {
            content.innerHTML = `
                <div class="sub-text"><strong>✨ 我的魂技</strong></div>
                <div class="sub-text" style="font-size:12px;">魂技来自魂环、魂骨与自创，威力随年限（品阶）提升。</div>
                <div class="item-list" style="margin-top:10px;" id="skillList"></div>
            `;
            renderSkillList();
        }
        function renderSkillList() {
            const list = document.getElementById('skillList');
            if (!list) return;
            list.innerHTML = '';
            if (game.skills.length === 0) { list.innerHTML = '<div style="color:rgba(150,180,255,.4);font-size:12px;">暂无魂技，去猎杀魂兽吧。</div>'; return; }
            game.skills.forEach(s => {
                const row = document.createElement('div');
                row.className = 'item-row';
                const power = (s.power || 1);
                row.innerHTML = `<span>${s.name}</span><span style="font-size:10px;">${'◆'.repeat(power)}</span><span style="font-size:10px;">来自「${s.source}」</span>`;
                list.appendChild(row);
            });
        }

        // ===== 战斗 =====
        function renderBattle(content) {
            const foePool = FOES_BY_ERA[game.era] || ['魂师'];
            content.innerHTML = `
                <div class="sub-text"><strong>⚔️ 魂师对决</strong></div>
                <div class="sub-text" style="font-size:12px;">挑战${game.era.split('·')[1] || ''}时代的强敌，争夺机缘。</div>
                <div class="button-group">
                    <button class="btn-action" onclick="startBattle()">⚔️ 寻找敌人</button>
                    <button class="btn-action btn-sm" onclick="startBossBattle()">👹 挑战首领</button>
                </div>
            `;
        }

        function startBattle() {
            const foe = weightedRandom(FOES_BY_ERA[game.era] || ['魂师']);
            const lv = game.level;
            makeEnemy(foe, lv, lv);
            addLog('important', `⚔️ 你挑战「${game.battleEnemy.name}」（${lv}级）。`);
            openBattle();
        }
        function startBossBattle() {
            const boss = weightedRandom(FOES_BY_ERA[game.era] || ['魂师']);
            const lv = Math.min(99, game.level + 5);
            makeEnemy('首领·' + boss, lv, lv);
            battleState.isBoss = true;
            addLog('important', `👹 首领战！「${game.battleEnemy.name}」（${lv}级·强化）！`);
            openBattle();
        }

        let battleState = { player: { hp: 100, maxHp: 100, attack: 50, defense: 50 }, enemy: null, locked: false, isBoss: false, isRingHunt: false };

        function openBattle() {
            const overlay = document.getElementById('battleOverlay');
            overlay.classList.add('active');
            const enemy = game.battleEnemy;
            if (!enemy) return;
            const stats = getPlayerStats();
            battleState.isRingHunt = !!enemy.isRingHunt;
            battleState.enemy = { ...enemy };
            battleState.isBoss = false;
            battleState.player = { hp: game.hp, maxHp: stats.maxHp, attack: stats.attack, defense: stats.defense };
            battleState.locked = false;
            updateBattleUI();
            const logEl = document.getElementById('battleLog');
            logEl.innerHTML = '';
            addBattleLog(`⚔️ 战斗开始！对手：${enemy.name}（${enemy.level}级）`);
            renderBattleActions();
        }

        function closeBattle() { document.getElementById('battleOverlay').classList.remove('active'); }

        function updateBattleUI() {
            const e = battleState.enemy;
            document.getElementById('battlePlayerName').textContent = `你（${game.gender}）`;
            document.getElementById('battlePlayerHP').textContent = `❤️ ${Math.max(0, Math.floor(battleState.player.hp))}/${battleState.player.maxHp}`;
            document.getElementById('battlePlayerStats').textContent = `${getTitle(game.level)} ${game.level}级 | 攻${battleState.player.attack} 防${battleState.player.defense}`;
            document.getElementById('battleEnemyName').textContent = e.name;
            document.getElementById('battleEnemyHP').textContent = `❤️ ${Math.max(0, Math.floor(e.hp))}/${e.maxHp}`;
            document.getElementById('battleEnemyStats').textContent = `${e.age ? e.age + ' · ' : ''}攻${e.attack} 防${e.defense}`;
        }

        function addBattleLog(text) {
            const el = document.getElementById('battleLog');
            const d = document.createElement('div');
            d.className = 'bl-entry'; d.textContent = text;
            el.appendChild(d); el.scrollTop = el.scrollHeight;
        }

        function renderBattleActions() {
            const el = document.getElementById('battleActions');
            el.innerHTML = '';

            const atkBtn = document.createElement('button');
            atkBtn.className = 'ba-btn'; atkBtn.textContent = '⚔️ 普通攻击';
            atkBtn.addEventListener('click', () => doAttack(0));
            el.appendChild(atkBtn);

            // 魂技按钮
            game.skills.forEach((s, i) => {
                const btn = document.createElement('button');
                btn.className = 'ba-btn'; btn.textContent = `✨ ${s.name}`;
                btn.addEventListener('click', () => doAttack(1 + s.power));
                el.appendChild(btn);
            });

            const fleeBtn = document.createElement('button');
            fleeBtn.className = 'ba-btn'; fleeBtn.textContent = '🏃 逃跑';
            fleeBtn.addEventListener('click', doFlee);
            el.appendChild(fleeBtn);
        }

        function doAttack(power) {
            if (battleState.locked) return;
            battleState.locked = true;
            let dmg;
            if (power === 0) dmg = Math.max(1, battleState.player.attack - battleState.enemy.defense) + rnd(0, 5);
            else dmg = Math.max(1, battleState.player.attack + power * 4 - battleState.enemy.defense) + rnd(0, 10);
            battleState.enemy.hp = Math.max(0, battleState.enemy.hp - dmg);
            addBattleLog(power === 0 ? `你造成${dmg}点伤害！` : `🌟 使用魂技造成${dmg}伤害！`);
            updateBattleUI();
            setTimeout(() => {
                if (battleState.enemy.hp <= 0) { handleVictory(); return; }
                enemyAttack(false);
            }, 400);
        }

        function enemyAttack(isCounter) {
            const eDmg = Math.max(1, battleState.enemy.attack - battleState.player.defense) + rnd(0, 8);
            battleState.player.hp = Math.max(0, battleState.player.hp - eDmg);
            addBattleLog(`敌人造成${eDmg}点伤害！`);
            updateBattleUI();
            if (battleState.player.hp <= 0) {
                addBattleLog('💀 你战败了...');
                game.hp = 0; battleState.locked = false;
                closeBattle();
                showSettlement('战败身亡');
                return;
            }
            battleState.locked = false;
            renderBattleActions();
        }

        function handleVictory() {
            const gold = rnd(60, 160), exp = rnd(30, 90);
            game.gold += gold; game.totalExp += 0;
            addBattleLog(`🎉 获胜！获得${gold}金币！`);
            // 十万年魂兽被击杀必得魂骨
            const is10wan = battleState.enemy && battleState.enemy.ageIdx === 4;
            // 战败/魂环
            if (battleState.isRingHunt) {
                addBattleLog('🌌 猎杀成功，吸收魂环！');
                const ringKill = battleState.enemy;
                game.battleEnemy = null; battleState.locked = false;
                absorbRing(ringKill);
                if (is10wan) { addBattleLog('🦴 十万年魂兽陨落，必得魂骨！'); dropBone({ force10wan: true }); }
            } else {
                if (battleState.isBoss) { addBattleLog('👹 首领已被击溃！'); gainExp(exp * 3); }
                else gainExp(exp);
                addBattleLog(`✨ 战斗经验+${battleState.isBoss ? exp * 3 : exp}！`);
                if (Math.random() < 0.3) {
                    const h = HERBS_DB[Math.floor(Math.random() * HERBS_DB.length)];
                    game.herbs.push({ ...h });
                    addBattleLog(`🎁 缴获灵药「${h.name}」！`);
                }
                if (is10wan) { addBattleLog('🦴 十万年魂兽陨落，必得魂骨！'); dropBone({ force10wan: true }); }
                else if (Math.random() < 0.18) { dropBone({}); }
                game.battleEnemy = null; battleState.locked = false;
            }
            renderStatus(); renderAllPanels();
            setTimeout(() => { closeBattle(); switchTab('battle'); renderAllPanels(); }, 500);
        }

        function doFlee() {
            if (battleState.locked) return;
            if (battleState.isBoss && Math.random() < 0.8) {
                addBattleLog('👹 首领狂暴，你无法脱身！');
                battleState.locked = true;
                enemyAttack(true);
                return;
            }
            if (Math.random() < 0.6) {
                addBattleLog('🏃 成功逃跑！');
                game.battleEnemy = null; battleState.locked = false;
                setTimeout(() => closeBattle(), 300);
            } else {
                addBattleLog('❌ 逃跑失败！');
                battleState.locked = true;
                enemyAttack(true);
            }
        }

        document.getElementById('battleClose').addEventListener('click', () => { if (!battleState.locked) closeBattle(); });
        document.getElementById('specialBtn').addEventListener('click', doSpecialSpin);
        document.getElementById('specialClose').addEventListener('click', closeSpecialDraw);

        // ===== 结算 =====
        function showSettlement(reason) {
            const overlay = document.getElementById('settlementOverlay');
            const container = document.getElementById('settlementContent');
            container.innerHTML = `
                <div class="settlement-section"><div class="s-title">📜 人物</div><div class="s-content">
                    <span>时代: ${game.era}</span><span>性别: ${game.gender}</span><span>寿元: ${game.ageValue}岁</span>
                    <span>武魂: ${game.spirit ? game.spirit.name : '无'}</span><span>先天: ${game.innate ? game.innate.label : ''}</span>
                    <span>封号: ${game.title}</span>
                </div></div>
                <div class="settlement-section"><div class="s-title">📈 修为</div><div class="s-content">
                    <span>境界: ${getTitle(game.level)} ${game.level}级</span><span>魂力经验: ${game.totalExp}</span><span>金币: ${game.gold}</span>
                </div></div>
                <div class="settlement-section"><div class="s-title">🌌 魂环</div><div class="s-content">
                    ${game.rings.map(r => `<span style="color:${r.color}">${r.name}</span>`).join('') || '<span>无</span>'}
                </div></div>
                <div class="settlement-section"><div class="s-title">✨ 魂技</div><div class="s-content">
                    ${game.skills.map(s => `<span>${s.name}</span>`).join('') || '<span>无</span>'}
                </div></div>
                <div class="settlement-section"><div class="s-title">🦴 魂骨</div><div class="s-content">
                    ${(function(){ const names=[]; ['head','torso','larm','rarm','lleg','rleg'].forEach(sl=>{ if(game.soulBones[sl]) names.push(game.soulBones[sl].name); }); (game.soulBones.ext||[]).forEach(b=>names.push(b.name)); return names.length ? names.map(n=>`<span>${n}</span>`).join('') : '<span>无</span>'; })()}
                </div></div>
                <div class="settlement-section"><div class="s-title">🪶 自创魂技</div><div class="s-content">
                    ${game.selfSkills.map(s => `<span>${s.name}</span>`).join('') || '<span>无</span>'}
                </div></div>
                <div class="settlement-section"><div class="s-title">🔧 魂导器</div><div class="s-content">
                    ${(game.soulTools || []).map(t => `<span>${t.name}</span>`).join('') || '<span>无</span>'}
                </div></div>
                <div style="text-align:center;color:#e74c3c;font-size:18px;margin-top:12px;">💀 ${reason}</div>
            `;
            overlay.classList.add('active');
        }

        document.getElementById('closeSettlement').addEventListener('click', () => location.reload());
        document.getElementById('restartWheel').addEventListener('click', resetToBuildPhase);

        function resetToBuildPhase() {
            document.getElementById('settlementOverlay').classList.remove('active');
            document.getElementById('gamePhase').classList.remove('active');
            document.getElementById('buildPhase').style.display = 'block';
            buildState.values = ['', '', '', '', ''];
            buildState.isSpinning = false; buildState.isComplete = false; buildState.rotation = 0;
            drawWheel(0);
            updateResultList(['', '', '', '', '']);
            btn.disabled = false;
            btn.querySelector('#btnText').textContent = '命运一转';
            btn.onclick = doFateSpin;
            game.level = 1; game.exp = 0; game.totalExp = 0; game.ageValue = 6; game.month = 1;
            game.hp = 100; game.maxHp = 100; game.ap = 50; game.maxAp = 50;
            game.gold = 80; game.rings = []; game.skills = []; game.selfSkills = []; game.soulTools = []; game.herbs = [];
            game.soulBones = { head: null, torso: null, larm: null, rarm: null, lleg: null, rleg: null, ext: [] };
            game.logs = []; game.battleEnemy = null; game.flags = {};
            game.title = '无';
            game.permanentBoosts = { expGain: 0, attack: 0, defense: 0, maxHp: 0, maxAp: 0 };
            syncMaxHp();
            rebuildSkills();
            renderLogs(); renderStatus(); renderAllPanels();
            document.getElementById('globalSubtitle').textContent = '一 人 一 魂 · 问 鼎 神 界';
        }

        document.getElementById('endGameBtn').addEventListener('click', () => showSettlement('主动结束'));
        document.getElementById('feedBtn').addEventListener('click', () => {
            game.hp = game.maxHp; game.ap = game.maxAp;
            addLog('important', '🍖 休息完毕，生命和行动点恢复。');
            renderStatus();
        });

        // 魂环面板（右侧栏）
        function renderRingPanel() {
            const el = document.getElementById('ringPanel');
            if (!el) return;
            el.innerHTML = '';
            if (game.rings.length === 0) { el.innerHTML = '<span style="color:rgba(150,180,255,.3);">暂无魂环</span>'; return; }
            game.rings.slice(-9).forEach(r => {
                const tag = document.createElement('span');
                tag.className = 'gu-tag ring-tag';
                tag.textContent = `${(r.skills || [])[0] || r.name}`;
                tag.title = `${r.name} · ${r.age}`;
                tag.style.color = r.color;
                el.appendChild(tag);
            });
        }
        function renderAllPanels() { renderSpiritPanel(); renderRingPanel(); renderHerbPanel(); renderBonePanel(); }

        // 魂骨面板（分类展示 + 装备状态）
        function renderBonePanel() {
            const el = document.getElementById('bonePanel');
            if (!el) return;
            el.innerHTML = '';
            let any = false;
            const rows = [];
            function row(label, bone) {
                if (!bone) return;
                any = true;
                const div = document.createElement('div');
                div.className = 'item-row';
                const sk = (bone.skills && bone.skills.length) ? `｜技「${bone.skills.join('、')}」` : '';
                div.innerHTML = `<span style="font-size:11px;">${label}·${bone.rar}</span><span style="font-size:11px;">${bone.name}</span><span style="font-size:10px;color:#8fd3ff;">攻+${bone.atk} 防+${bone.def} 命+${bone.hp}</span>`;
                div.title = sk ? `附带魂技：${bone.skills.join('、')}` : '';
                el.appendChild(div);
            }
            ['head', 'torso', 'larm', 'rarm', 'lleg', 'rleg'].forEach(slot => { if (game.soulBones[slot]) row(BONE_LABEL[slot], game.soulBones[slot]); });
            (game.soulBones.ext || []).forEach(b => { row('外附', b); });
            if (!any) el.innerHTML = '<span style="color:rgba(150,180,255,.3);font-size:11px;">暂无魂骨，猎杀魂兽有几率掉落</span>';
        }

        // 灵药面板
        function renderHerbPanel() {
            const el = document.getElementById('herbPanel');
            if (!el) return;
            el.innerHTML = '';
            if (game.herbs.length === 0) { el.innerHTML = '<span style="color:rgba(150,180,255,.3);">暂无灵药</span>'; return; }
            game.herbs.forEach((h, i) => {
                const tag = document.createElement('span');
                tag.className = 'gu-tag';
                tag.textContent = h.name;
                tag.style.cursor = 'pointer';
                tag.title = `点击使用：${h.desc || ''}`;
                tag.addEventListener('click', () => useHerb(i));
                el.appendChild(tag);
            });
        }

        // ===== 使用灵药 =====
        function useHerb(index) {
            if (index < 0 || index >= game.herbs.length) return;
            const herb = game.herbs[index];
            const eff = herb.effect || {};
            if (eff.type === 'exp') { gainExp(eff.amount); addLog('important', `服用「${herb.name}」，获得${eff.amount}魂力经验！`); }
            else if (eff.type === 'attack') { game.permanentBoosts.attack += eff.amount; addLog('important', `服用「${herb.name}」，攻击+${eff.amount}！`); }
            else if (eff.type === 'defense') { game.permanentBoosts.defense += eff.amount; addLog('important', `服用「${herb.name}」，防御+${eff.amount}！`); }
            else if (eff.type === 'maxHp') { game.permanentBoosts.maxHp += eff.amount; syncMaxHp(); addLog('important', `服用「${herb.name}」，生命上限+${eff.amount}！`); }
            else if (eff.type === 'healAll') { game.hp = game.maxHp; addLog('important', `服用「${herb.name}」，生命完全恢复！`); }
            else { addLog('info', `服用「${herb.name}」，但无效果。`); }
            game.herbs.splice(index, 1);
            syncMaxHp();
            renderStatus();
        }

        // ===== 中间面板刷新（修炼/魂环/魂技） =====
        function renderMiddlePanel(tab) {
            if (!document.getElementById('gamePhase').classList.contains('active')) return;
            switchTab(tab);
        }

        // ===== 初始化 =====
        // 版本号（随 harness 步数递增）
        const VERSION = 'v0.0.228';

        function init() {
            drawWheel(0);
            updateResultList(['', '', '', '', '']);
            btn.addEventListener('click', doFateSpin);
            canvas.addEventListener('click', doFateSpin);
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.addEventListener('click', () => switchTab(b.dataset.tab));
            });
            const vb = document.getElementById('versionBadge');
            if (vb) vb.textContent = VERSION;
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
